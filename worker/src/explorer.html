<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="原神のキャラクター・武器・聖遺物・任務のデータを配信するデータベースAPIです。">
<link rel="icon" href="data:,">
<title>原神データベース API</title>
<style>
:root{
  --hdr:56px;
  --side-w:224px;
  --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
  --sans-zh:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei UI","Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;
  --bg:#ffffff;
  --bg-2:#f7f8fa;
  --hover:#f1f3f6;
  --sel:#eaf0fd;
  --line:#e5e7eb;
  --line-2:#d3d8de;
  --fg:#1b1f24;
  --fg-2:#57606a;
  --fg-3:#8a939d;
  --accent:#2557d6;
  --ring:rgba(37,87,214,.16);
  --code:#f6f8fa;
  --r5:#b8741a;
  --r4:#7b57c9;
  --err-bg:#fef3f2;
  --err-line:#fbcfca;
  --j-key:#0b4f9e;
  --j-str:#116329;
  --j-num:#9a4300;
  --j-kw:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1116;
    --bg-2:#12161c;
    --hover:#191e26;
    --sel:#172343;
    --line:#252b34;
    --line-2:#333b46;
    --fg:#e4e7eb;
    --fg-2:#9ea7b3;
    --fg-3:#6c7581;
    --accent:#7fa3ff;
    --ring:rgba(127,163,255,.22);
    --code:#12161c;
    --r5:#e2ae52;
    --r4:#b49cf2;
    --err-bg:#2a1616;
    --err-line:#5a2a28;
    --j-key:#8db5ff;
    --j-str:#9ad3a6;
    --j-num:#f0b06e;
    --j-kw:#f3968c;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
:lang(zh){font-family:var(--sans-zh)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,kbd,pre{font-family:var(--mono)}
button{font:inherit;color:inherit}
svg{flex:none;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;height:var(--hdr);padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;flex:none;width:calc(var(--side-w) - 16px);color:var(--fg);font-size:15px;font-weight:600;white-space:nowrap}
.brand:hover{text-decoration:none}
.badge{font:500 11px/1 var(--mono);color:var(--fg-2);border:1px solid var(--line-2);border-radius:4px;padding:3px 5px}
.search{display:flex;align-items:center;gap:8px;flex:1;max-width:520px;height:34px;padding:0 8px 0 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg-2);color:var(--fg-3);cursor:text}
.search:focus-within{border-color:var(--accent);background:var(--bg);box-shadow:0 0 0 3px var(--ring)}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--fg);font:inherit}
.search input::placeholder{color:var(--fg-3)}
.search input:not(:placeholder-shown)+kbd,.search:focus-within kbd{display:none}
kbd{display:inline-block;font:11px/1 var(--mono);color:var(--fg-2);background:var(--bg);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:2px 5px}
.seg{display:flex;flex:none;margin-left:auto;padding:2px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg-2)}
.seg button{border:0;background:transparent;padding:3px 10px;border-radius:6px;font-size:13px;line-height:1.5;color:var(--fg-2);cursor:pointer}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgba(0,0,0,.06)}
.hdr-link{display:flex;align-items:center;gap:4px;flex:none;font:13px var(--mono);color:var(--fg-2)}
.hdr-link:hover{color:var(--fg);text-decoration:none}

.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) minmax(0,1.25fr);grid-template-areas:"side list detail";height:calc(100vh - var(--hdr));height:calc(100dvh - var(--hdr))}
.app[data-mode="about"]{grid-template-columns:var(--side-w) minmax(0,1fr);grid-template-areas:"side detail"}
.app[data-mode="about"] .list{display:none}
.side{grid-area:side;position:relative;display:flex;flex-direction:column;padding:12px 8px;background:var(--bg-2);border-right:1px solid var(--line);overflow-y:auto}
.list{grid-area:list;overflow-y:auto;border-right:1px solid var(--line)}
.detail{grid-area:detail;overflow-y:auto}
.side,.list,.detail{min-height:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}

.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:6px;color:var(--fg-2);font-size:13.5px}
.nav a:hover{background:var(--hover);color:var(--fg);text-decoration:none}
.nav a[aria-current="page"]{background:var(--sel);color:var(--accent);font-weight:600}
.nav-n{font:12px var(--mono);color:var(--fg-3)}
.nav a[aria-current="page"] .nav-n{color:inherit;font-weight:400}
.nav-group{padding:18px 10px 4px;font-size:12px;font-weight:600;color:var(--fg-3)}
.side-foot{margin-top:auto;padding:20px 10px 4px;font-size:11.5px;line-height:1.55;color:var(--fg-3)}
.side-foot p{margin:0 0 8px}
.side-foot code{font-size:11px;color:var(--fg-2)}

.list-head{position:sticky;top:0;z-index:2;padding:14px 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.lh-title{display:flex;align-items:baseline;gap:8px;min-width:0}
.lh-title h2{margin:0;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh-count{flex:none;font-size:12.5px;color:var(--fg-3)}
.lh-req{display:flex;align-items:center;gap:8px;min-width:0;margin-top:6px}
.lh-path{min-width:0;font:12.5px var(--mono);color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh-sub{margin:4px 0 0;font-size:12.5px;color:var(--fg-3)}
.method{flex:none;font:600 10.5px/1 var(--mono);letter-spacing:.04em;color:var(--accent);background:var(--sel);border-radius:4px;padding:4px 6px}
.list-group{display:flex;justify-content:space-between;padding:16px 16px 6px;font-size:12px;font-weight:600;color:var(--fg-3);border-bottom:1px solid var(--line)}
.list-group span:last-child{font:12px var(--mono)}

.row{display:flex;align-items:center;gap:12px;padding:10px 16px;color:inherit;border-bottom:1px solid var(--line)}
.row:hover{background:var(--hover);text-decoration:none}
.row[aria-current]{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.row:focus-visible{outline-offset:-2px}
.row-main{flex:1;min-width:0}
.row-title{display:block;font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{display:block;font-size:12.5px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub>span+span::before{content:"·";margin:0 6px;color:var(--fg-3)}

.avatar{flex:none;display:block;border-radius:50%;background:var(--bg-2);border:1px solid var(--line);overflow:hidden}
.avatar img{display:block;width:100%;height:100%;object-fit:cover}
.avatar.r5{background:color-mix(in srgb,var(--r5) 14%,var(--bg))}
.avatar.r4{background:color-mix(in srgb,var(--r4) 14%,var(--bg))}
.avatar.sm{width:36px;height:36px}
.avatar.lg{width:72px;height:72px}
.rarity{flex:none;font:600 12px var(--mono);color:var(--fg-3);white-space:nowrap}
.rarity.r5{color:var(--r5)}
.rarity.r4{color:var(--r4)}
.dot{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%;vertical-align:1px}

.pane{padding:24px 28px 48px}
.back{display:none}
.d-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.d-kicker{margin:0;font-size:12.5px;color:var(--fg-3)}
.d-head h1{margin:0;font-size:22px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.d-sub{margin:2px 0 0;color:var(--fg-2)}
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:0 0 24px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.props>div{min-width:0;padding:9px 12px;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.props dt{margin-bottom:2px;font-size:11.5px;color:var(--fg-3)}
.props dd{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.props dd code{font-size:12.5px}

.req{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 10px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px 8px 0 0}
.req.solo{border-radius:8px}
.req-path{flex:1;min-width:0;font-size:12.5px;color:var(--fg);overflow-wrap:anywhere}
.code{border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;overflow:hidden}
.code-bar{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;font-size:12px;color:var(--fg-3);border-bottom:1px solid var(--line)}
.grow{flex:1}
pre.json{margin:0;padding:14px 16px;background:var(--code);color:var(--fg);font-size:12.5px;line-height:1.6;tab-size:2;white-space:pre-wrap;overflow-wrap:anywhere}
.j-key{color:var(--j-key)}
.j-str{color:var(--j-str)}
.j-num{color:var(--j-num)}
.j-kw{color:var(--j-kw)}
.j-null{color:var(--fg-3)}

.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);color:var(--fg);font-size:12.5px;white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--hover);text-decoration:none}
.icon-btn{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--fg-2);cursor:pointer}
.icon-btn:hover{background:var(--hover);color:var(--fg)}

.doc{max-width:780px}
.doc h1{margin:8px 0 10px;font-size:28px;font-weight:650;line-height:1.25;letter-spacing:-.01em}
.lead{max-width:62ch;margin:0 0 24px;font-size:15.5px;color:var(--fg-2)}
.doc h2{margin:36px 0 12px;padding-top:24px;font-size:17px;font-weight:600;border-top:1px solid var(--line)}
.doc p{margin:0 0 12px}
.doc ul{margin:0;padding-left:20px}
.doc li{margin:4px 0}
.doc li code,.doc p code{padding:1px 5px;font-size:12.5px;background:var(--bg-2);border:1px solid var(--line);border-radius:4px}
.doc pre.json{border:1px solid var(--line);border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;padding:14px 16px;border:1px solid var(--line);border-radius:8px;color:var(--fg)}
.stat:hover{background:var(--hover);border-color:var(--line-2);text-decoration:none}
.stat-n{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat-l{font-size:12.5px;color:var(--fg-2)}
.doc-meta{margin:14px 0 0;font-size:12.5px;color:var(--fg-3)}
.doc .doc-meta code{padding:0;background:none;border:0;color:var(--fg-2)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:12px;font-weight:600;color:var(--fg-3);background:var(--bg-2)}
tr:last-child td{border-bottom:0}
td code{font-size:12.5px;white-space:nowrap}
.ep{display:flex;align-items:center;gap:8px}
.vals code+code{margin-left:6px}
.legal{font-size:12px;color:var(--fg-3)}
.doc .legal{margin-top:48px;padding-top:16px;border-top:1px solid var(--line)}

.empty{max-width:560px}
.empty-text{margin:16px 0 8px;color:var(--fg-2)}
.empty-hint{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0;font-size:12.5px;color:var(--fg-3)}
.note{margin:0;padding:16px;font-size:13px;color:var(--fg-3)}
.pane .note{padding:0}
.error{margin:16px;padding:12px 14px;font-size:13px;background:var(--err-bg);border:1px solid var(--err-line);border-radius:8px}
.pane .error{margin:0}
.error p{margin:0 0 8px}
.error-detail{font:12px var(--mono);color:var(--fg-2);overflow-wrap:anywhere}

@media (max-width:1023px){
  .app{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"side side" "list detail"}
  .app[data-mode="about"]{grid-template-columns:minmax(0,1fr);grid-template-areas:"side" "detail"}
  .brand{width:auto}
  .side{flex-direction:row;padding:0 8px;background:var(--bg);border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .nav{flex-direction:row;gap:0}
  .nav a{padding:10px 10px 8px;border-radius:0;border-bottom:2px solid transparent;font-size:13px;white-space:nowrap}
  .nav a:hover{background:none}
  .nav a[aria-current="page"]{background:none;border-bottom-color:var(--accent)}
  .nav-n,.nav-group,.side-foot{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:719px){
  .top{flex-wrap:wrap;height:auto;padding:10px 16px;gap:10px 12px}
  .brand{flex:1;font-size:14.5px}
  .search{order:3;flex-basis:100%;max-width:none}
  .search kbd,.hdr-link,.empty-hint{display:none}
  .app{display:block;height:auto}
  .list,.detail{overflow:visible;border:0}
  .list-head{position:static}
  .app[data-mode="list"] .detail,.app[data-mode="item"] .list{display:none}
  .back{display:inline-flex;align-items:center;gap:4px;margin:-4px 0 16px;font-size:13px}
  .pane{padding:20px 16px 40px}
  .doc h1{font-size:23px}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" id="brand" href="#/ja"><span id="brand-name">原神データベース API</span> <span class="badge">v1</span></a>
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="名前・英語名・ID・スラグで検索" autocomplete="off" spellcheck="false" aria-label="検索">
    <kbd>/</kbd>
  </label>
  <div class="seg" id="seg" role="group" aria-label="言語">
    <button type="button" data-loc="en" lang="en">EN</button><button type="button" data-loc="ja" lang="ja">日本語</button><button type="button" data-loc="zh" lang="zh-Hans">中文</button>
  </div>
  <a class="hdr-link" href="/v1" target="_blank" rel="noopener">/v1</a>
</header>
<div class="app" id="app">
  <nav class="side" id="side" aria-label="カテゴリ">
    <div class="nav" id="nav"></div>
    <div class="side-foot">
      <p id="ver"></p>
      <p class="legal" id="legal"></p>
    </div>
  </nav>
  <section class="list" id="list" aria-label="一覧"></section>
  <section class="detail" id="detail" aria-label="詳細"></section>
</div>
<noscript>
  <p class="note" lang="ja">JavaScriptが無効化されています。データは <a href="/v1">/v1</a> から直接取得できます。</p>
  <p class="note" lang="en">JavaScript is disabled. The data is available directly at <a href="/v1">/v1</a>.</p>
  <p class="note" lang="zh-Hans">JavaScript已禁用。数据可直接通过 <a href="/v1">/v1</a> 获取。</p>
</noscript>
<script>
"use strict";

const LOCALES = ["en", "ja", "zh"];
const CAT_KEYS = ["characters", "weapons", "artifacts"];
const QTYPE_KEYS = ["archon", "story", "world", "event", "hangout"];
const ELEM_COLOR = { Pyro: "#e5653e", Hydro: "#3a8ee6", Electro: "#9b63d9", Dendro: "#6fa83a", Anemo: "#35ae97", Cryo: "#5cbbd4", Geo: "#d29f28" };
const ELEM_ALIAS = { "風": "Anemo", "岩": "Geo", "雷": "Electro", "草": "Dendro", "水": "Hydro", "炎": "Pyro", "火": "Pyro", "氷": "Cryo", "冰": "Cryo" };
const SEARCH_LIMIT = 50;
const ENDPOINT_PATHS = [
  "/v1",
  "/v1/{locale}",
  "/v1/{locale}/{category}",
  "/v1/{locale}/{category}/{slug}",
  "/v1/{locale}/quests",
  "/v1/{locale}/quests/{quest_type}",
  "/v1/{locale}/quests/{quest_type}/{slug}",
  "/v1/icons",
  "/v1/icons/{file}",
];
const SVG = {
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  ext: '<path d="M7 17 17 7"/><path d="M8 7h9v9"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
};

const code = (s) => h("code", null, s);

const I18N = {
  ja: {
    tag: "ja-JP",
    site: "原神データベース API",
    description: "原神のキャラクター・武器・聖遺物・任務のデータを配信するデータベースAPIです。",

    searchLabel: "検索",
    langLabel: "言語",
    navLabel: "カテゴリ",
    listLabel: "一覧",
    detailLabel: "詳細",
    about: "概要",
    groupData: "データ",
    groupQuests: "任務",
    cats: { characters: "キャラクター", weapons: "武器", artifacts: "聖遺物" },
    qtypes: { archon: "魔神任務", story: "伝説任務", world: "世界任務", event: "イベント任務", hangout: "デート任務" },
    quests: "任務",
    count: (n, s) => `${s} 件`,
    loading: "読み込み中…",
    searchTitle: (q) => `「${q}」の検索結果`,
    searchDocTitle: (q) => `「${q}」の検索`,
    searchScope: "日本語のデータ全体から検索しています",
    searchMore: (n, s) => `ほか ${s} 件。キーワードを絞り込んでください。`,
    noHits: "一致する項目は見つかりませんでした。",
    searchFailed: "検索用の一覧を取得できませんでした",
    loadFailed: "読み込みに失敗しました。",
    retry: "再試行",
    copy: "コピー",
    copyUrl: "URL をコピー",
    copied: "コピーしました",
    copyFailed: "コピーできませんでした",
    open: "開く",
    response: "レスポンス",
    back: "一覧に戻る",
    notFound: (path, slug) => `${path} に「${slug}」は見つかりませんでした`,
    untitled: "(名称なし)",
    rarity: "レアリティ",
    element: "元素",
    weapon: "武器",
    weaponType: "種類",
    baseAtk: "基礎攻撃力",
    setBonus: "セット効果",
    chapter: "章",
    act: "幕",
    region: "地域",
    id: "ID",
    slug: "スラグ",
    baseAtkValue: (n) => `基礎攻撃力 ${n}`,
    setBonusCount: (n) => `${n} 種`,
    setBonusRow: (n) => `セット効果 ${n} 種`,
    emptyText: (fromSearch) => `${fromSearch ? "検索結果" : "一覧"}から項目を選ぶと、レスポンスの JSON をここに表示します。`,
    keyHint: (up, down, slash) => [up, down, " で移動、", slash, " で検索"],
    lead: "原神のキャラクター・武器・聖遺物・任務のデータを JSON で配信する非公式 API です。英語・日本語・簡体字中国語の 3 言語に対応しています。",
    dataMeta: (ver, when) => ["日本語データ ・ バージョン ", ver, when ? ` ・ ${when} 生成` : ""],
    endpoints: "エンドポイント",

const $ = (s, root = document) => root.querySelector(s);

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  e.append(...kids.flat(Infinity).filter((c) => c != null && c !== false).map((c) => (c instanceof Node ? c : String(c))));
  return e;
}

function icon(name, size = 14) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SVG[name]}</svg>`;
}

const fmt = (n) => (n == null ? "-" : Number(n).toLocaleString(L.tag));
const countText = (n) => L.count(n, fmt(n));
const dataLang = (loc) => (loc === "zh" ? "zh-Hans" : loc);
const isQuest = (view) => view.startsWith("quests/");
const kindOf = (view) => (isQuest(view) ? "quests" : view);
const viewLabel = (view) => (isQuest(view) ? L.qtypes[view.slice(7)] : L.cats[view] || L.about);
const apiPath = (loc, view) => `/v1/${loc}/${view}`;
const titleOf = (it) => it.name || it.title || it.slug || L.untitled;
const norm = (s) => String(s).normalize("NFKC").toLowerCase();

function safeDecode(s) {
  try {
    return decodeURIComponent(s);
  } catch {
    return s;
  }
}

function hrefFor(loc, view, slug) {
  let s = "#/" + loc;
  if (view !== "about") s += "/" + view;
  if (view !== "about" && slug != null) s += "/" + encodeURIComponent(slug);
  return s;
}

function parseHash() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(safeDecode);
  const loc = LOCALES.includes(parts[0]) ? parts[0] : "ja";
  if (parts[1] === "quests" && QTYPE_KEYS.includes(parts[2])) return { loc, view: "quests/" + parts[2], slug: parts[3] ?? null };
  if (CAT_KEYS.includes(parts[1])) return { loc, view: parts[1], slug: parts[2] ?? null };
  return { loc, view: "about", slug: null };
}

const http = new Map();
function getJSON(url) {
  let p = http.get(url);
  if (!p) {
    p = fetch(url, { headers: { Accept: "application/json" } }).then((r) => {
      if (!r.ok) throw new Error(`HTTP ${r.status} (${safeDecode(url)})`);
      return r.json();
    });
    p.catch(() => http.delete(url));
    http.set(url, p);
  }
  return p;
}

let iconsPromise = null;
function iconMap() {
  iconsPromise ??= getJSON("/v1/icons").then(
    (d) => new Map((d.items || []).map((i) => [String(i.id), i.file])),
    () => {
      iconsPromise = null;
      return new Map();
    },
  );
  return iconsPromise;
}

const countsCache = new Map();
function counts(loc) {
  if (!countsCache.has(loc)) {
    const p = Promise.all([getJSON("/v1"), getJSON(`/v1/${loc}/quests`).catch(() => null)]).then(([m, q]) => {
      const c = { quests: m.counts?.[`quests/${loc}`] };
      for (const k of CAT_KEYS) c[k] = m.counts?.[`${k}/${loc}`];
      for (const k of QTYPE_KEYS) c["quests/" + k] = q?.quest_types?.[k]?.count;
      return c;
    });
    p.catch(() => countsCache.delete(loc));
    countsCache.set(loc, p);
  }
  return countsCache.get(loc);
}

const searchCache = new Map();
function searchIndexes(loc) {
  if (!searchCache.has(loc)) {
    const views = [...CAT_KEYS, ...QTYPE_KEYS.map((q) => "quests/" + q)];
    const p = Promise.all(views.map((view) => getJSON(apiPath(loc, view)).then((d) => ({ view, items: d.items || [] }), () => null)))
      .then((groups) => {
        const ok = groups.filter(Boolean);
        if (!ok.length) throw new Error(I18N[loc].searchFailed);
        return ok;
      });
    p.catch(() => searchCache.delete(loc));
    searchCache.set(loc, p);
  }
  return searchCache.get(loc);
}

function highlight(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(
    /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false)\b|\b(null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    (m, str, colon, bool, nul, num) => {
      if (str) return colon ? `<span class="j-key">${str}</span>${colon}` : `<span class="j-str">${str}</span>`;
      if (bool) return `<span class="j-kw">${bool}</span>`;
      if (nul) return '<span class="j-null">null</span>';
      if (num) return `<span class="j-num">${num}</span>`;
      return m;
    },
  );
}

function elemOf(it) {
  const v = it.element_en || it.element;
  if (!v) return null;
  return ELEM_COLOR[v] ? v : ELEM_ALIAS[v] || null;
}

function elemTag(it) {
  const canon = elemOf(it);
  if (!canon) return it.element || null;
  return h("span", null, h("i", { class: "dot", style: `background:${ELEM_COLOR[canon]}` }), it.element || canon);
}

function rarity(n) {
  const r = parseInt(n, 10);
  return r ? h("span", { class: `rarity r${r}`, title: `${L.rarity} ${r}` }, `★${r}`) : null;
}

function avatar(file, size, rar) {
  const wrap = h("span", { class: `avatar ${size}${rar ? " r" + rar : ""}` });
  if (file) {
    const img = h("img", { src: "/v1/icons/" + encodeURIComponent(file), alt: "", loading: "lazy", decoding: "async" });
    img.addEventListener("error", () => img.remove());
    wrap.append(img);
  }
  return wrap;
}

function copyBtn(getText, label, iconOnly) {
  const b = h("button", { type: "button", class: iconOnly ? "icon-btn" : "btn", title: label, "aria-label": label, html: icon("copy") }, iconOnly ? null : label);
  const original = b.innerHTML;
  let timer = 0;
  b.addEventListener("click", () => {
    const done = (msg, ok) => {
      b.innerHTML = (ok ? icon("check") : "") + (iconOnly ? "" : msg);
      b.title = msg;
      clearTimeout(timer);
      timer = setTimeout(() => {
        b.innerHTML = original;
        b.title = label;
      }, 1400);
    };
    navigator.clipboard.writeText(getText()).then(() => done(L.copied, true), () => done(L.copyFailed, false));
  });
  return b;
}

function errorBox(e, retry) {
  return h("div", { class: "error", role: "alert" },
    h("p", null, L.loadFailed),
    h("p", { class: "error-detail" }, e && e.message ? e.message : String(e)),
    h("button", { type: "button", class: "btn", onclick: retry }, L.retry));
}

function rowFor(it, loc, view, icons) {
  const kind = kindOf(view);
  const title = titleOf(it);
  const en = it.en_name && it.en_name !== title ? it.en_name : null;
  const sub = [];
  let lead = null;
  let tail = null;
  if (kind === "characters") {
    lead = avatar(icons && icons.get(String(it.id)), "sm", it.rarity);
    sub.push(en, elemTag(it), it.weapon);
    tail = rarity(it.rarity);
  } else if (kind === "weapons") {
    sub.push(en, it.type, it.base_atk ? L.baseAtkValue(it.base_atk) : null);
    tail = rarity(it.rarity);
  } else if (kind === "artifacts") {
    sub.push(en, it.affixes ? L.setBonusRow(it.affixes) : null);
  } else {
    sub.push(it.chapter !== title ? it.chapter : null, it.act, it.region);
  }
  const parts = sub.filter((s) => s != null && s !== "").map((s) => h("span", null, s));
  return h("a", { class: "row", href: hrefFor(loc, view, it.slug), "data-view": view, "data-slug": it.slug },
    lead,
    h("span", { class: "row-main" },
      h("span", { class: "row-title" }, title),
      parts.length ? h("span", { class: "row-sub" }, parts) : null),
    tail);
}

function markCurrent(scroll) {
  const list = $("#list");
  const prev = list.querySelector(".row[aria-current]");
  if (prev) prev.removeAttribute("aria-current");
  if (state.slug == null) return;
  for (const row of list.querySelectorAll(".row")) {
    if (row.dataset.view === state.view && row.dataset.slug === state.slug) {
      row.setAttribute("aria-current", "true");
      if (scroll && !narrow.matches) row.scrollIntoView({ block: "center" });
      return;
    }
  }
}

function matches(it, q) {
  return [it.name, it.en_name, it.title, it.slug, it.id].some((v) => v != null && norm(v).includes(q));
}

function prefixRank(it, q) {
  return [it.name, it.en_name, it.title].some((v) => v != null && norm(v).startsWith(q)) ? 0 : 1;
}

async function renderList() {
  const token = ++listToken;
  const { loc, view, query } = state;
  const list = $("#list");
  const head = h("div", { class: "list-head" });
  const body = h("div", null, h("p", { class: "note" }, L.loading));
  const count = h("span", { class: "lh-count" });
  list.replaceChildren(head, body);
  list.scrollTop = 0;
  try {
    if (query) {
      head.append(
        h("div", { class: "lh-title" }, h("h2", null, L.searchTitle(query)), count),
        h("p", { class: "lh-sub" }, L.searchScope));
      const [groups, icons] = await Promise.all([searchIndexes(loc), iconMap()]);
      if (token !== listToken) return;
      const q = norm(query);
      const frag = document.createDocumentFragment();
      let total = 0;
      for (const g of groups) {
        const hits = g.items.filter((it) => matches(it, q)).sort((a, b) => prefixRank(a, q) - prefixRank(b, q));
        if (!hits.length) continue;
        total += hits.length;
        frag.append(h("div", { class: "list-group" }, h("span", null, viewLabel(g.view)), h("span", null, fmt(hits.length))));
        for (const it of hits.slice(0, SEARCH_LIMIT)) frag.append(rowFor(it, loc, g.view, icons));
        if (hits.length > SEARCH_LIMIT) {
          const rest = hits.length - SEARCH_LIMIT;
          frag.append(h("p", { class: "note" }, L.searchMore(rest, fmt(rest))));
        }
      }
      count.textContent = countText(total);
      body.replaceChildren(total ? frag : h("p", { class: "note" }, L.noHits));
    } else {
      const path = apiPath(loc, view);
      head.append(
        h("div", { class: "lh-title" }, h("h2", null, viewLabel(view)), count),
        h("div", { class: "lh-req" }, h("span", { class: "method" }, "GET"), h("a", { class: "lh-path", href: path, target: "_blank", rel: "noopener" }, path)));
      const [idx, icons] = await Promise.all([getJSON(path), view === "characters" ? iconMap() : null]);
      if (token !== listToken) return;
      const items = idx.items || [];
      const frag = document.createDocumentFragment();
      for (const it of items) frag.append(rowFor(it, loc, view, icons));
      count.textContent = countText(items.length);
      body.replaceChildren(frag);
    }
    markCurrent(true);
  } catch (e) {
    if (token !== listToken) return;
    body.replaceChildren(errorBox(e, () => {
      listKey = null;
      render();
    }));
  }
}

function backLink() {
  return h("a", { class: "back", href: hrefFor(state.loc, state.view, null), html: icon("back") }, L.back);
}

function propsList(it, kind) {
  const rows = [];
  const add = (label, value) => {
    if (value == null || value === "") return;
    rows.push(h("div", null, h("dt", null, label), h("dd", null, value)));
  };
  if (kind === "characters") {
    add(L.rarity, rarity(it.rarity));
    add(L.element, elemTag(it));
    add(L.weapon, it.weapon);
  } else if (kind === "weapons") {
    add(L.rarity, rarity(it.rarity));
    add(L.weaponType, it.type);
    add(L.baseAtk, it.base_atk);
  } else if (kind === "artifacts") {
    add(L.setBonus, it.affixes ? L.setBonusCount(it.affixes) : null);
  } else {
    add(L.chapter, it.chapter !== titleOf(it) ? it.chapter : null);
    add(L.act, it.act);
    add(L.region, it.region);
  }
  add(L.id, it.id != null ? code(it.id) : null);
  add(L.slug, code(it.slug));
  return h("dl", { class: "props" }, rows);
}

function endpoint(url, data) {
  const raw = JSON.stringify(data, null, 2);
  return h("section", null,
    h("div", { class: "req" },
      h("span", { class: "method" }, "GET"),
      h("code", { class: "req-path" }, safeDecode(url)),
      copyBtn(() => new URL(url, location.origin).href, L.copyUrl, true)),
    h("div", { class: "code" },
      h("div", { class: "code-bar" },
        h("span", null, L.response),
        h("span", { class: "grow" }),
        copyBtn(() => raw, L.copy, false),
        h("a", { class: "btn", href: url, target: "_blank", rel: "noopener", html: icon("ext") }, L.open)),
      h("pre", { class: "json", html: highlight(raw) })));
}

async function renderItem(pane, token) {
  const { loc, view, slug } = state;
  const kind = kindOf(view);
  pane.replaceChildren(backLink(), h("p", { class: "note" }, L.loading));
  try {
    const [idx, icons] = await Promise.all([getJSON(apiPath(loc, view)), kind === "characters" ? iconMap() : null]);
    if (token !== detailToken) return;
    const it = (idx.items || []).find((x) => x.slug === slug);
    if (!it) throw new Error(L.notFound(apiPath(loc, view), slug));
    const data = await getJSON(it.url);
    if (token !== detailToken) return;
    const title = titleOf(it);
    const en = it.en_name && it.en_name !== title ? it.en_name : null;
    document.title = `${title} - ${L.site}`;
    pane.replaceChildren(
      backLink(),
      h("header", { class: "d-head" },
        kind === "characters" ? avatar(icons.get(String(it.id)), "lg", it.rarity) : null,
        h("div", null,
          h("p", { class: "d-kicker" }, viewLabel(view)),
          h("h1", null, title),
          en ? h("p", { class: "d-sub", lang: "en" }, en) : null)),
      propsList(it, kind),
      endpoint(it.url, data));
  } catch (e) {
    if (token !== detailToken) return;
    pane.replaceChildren(backLink(), errorBox(e, () => {
      detailKey = null;
      render();
    }));
  }
}

function renderEmpty(pane) {
  const { loc, view, query } = state;
  const path = apiPath(loc, view);
  pane.classList.add("empty");
  if (!query) {
    pane.append(h("div", { class: "req solo" },
      h("span", { class: "method" }, "GET"),
      h("code", { class: "req-path" }, path),
      copyBtn(() => location.origin + path, L.copyUrl, true)));
  }
  pane.append(
    h("p", { class: "empty-text" }, L.emptyText(Boolean(query))),
    h("p", { class: "empty-hint" }, L.keyHint(h("kbd", null, "↑"), h("kbd", null, "↓"), h("kbd", null, "/"))));
}

function table(headers, rows) {
  return h("div", { class: "tbl" }, h("table", null,
    h("thead", null, h("tr", null, headers.map((t) => h("th", null, t)))),
    h("tbody", null, rows.map((r) => h("tr", null, r.map((c, i) => h("td", { class: i ? "vals" : null }, c)))))));
}

async function renderAbout(pane, token) {
  const loc = state.loc;
  const origin = location.origin;
  const stats = h("div", { class: "stats" });
  const meta = h("p", { class: "doc-meta" }, L.loading);
  const codes = (list) => list.map((v) => code(v));
  pane.classList.add("doc");
  pane.replaceChildren(
    h("h1", null, L.site),
    h("p", { class: "lead" }, L.lead),
    stats,
    meta,
    h("h2", null, L.endpoints),
    table(L.endpointCols, ENDPOINT_PATHS.map((p, i) => [h("span", { class: "ep" }, h("span", { class: "method" }, "GET"), code(p)), L.endpointDescs[i]])),
    h("h2", null, L.params),
    table(L.paramCols, [
      [code("locale"), codes(LOCALES)],
      [code("category"), codes(CAT_KEYS)],
      [code("quest_type"), codes(QTYPE_KEYS)],
      [code("slug"), L.slugValue()],
    ]),
    h("h2", null, L.examples),
    h("pre", { class: "json" }, `curl ${origin}/v1\ncurl ${origin}/v1/${loc}/characters`),
    h("h2", null, L.caching),
    h("ul", null, L.cachingNotes().map((parts) => h("li", null, parts))),
    h("p", { class: "legal" }, L.legal));
  try {
    const [m, c] = await Promise.all([getJSON("/v1"), counts(loc)]);
    if (token !== detailToken) return;
    for (const k of [...CAT_KEYS, "quests"]) {
      const view = k === "quests" ? "quests/archon" : k;
      stats.append(h("a", { class: "stat", href: hrefFor(loc, view, null) },
        h("span", { class: "stat-n" }, fmt(c[k])),
        h("span", { class: "stat-l" }, k === "quests" ? L.quests : L.cats[k])));
    }
    const when = m.generated_at ? new Date(m.generated_at).toLocaleString(L.tag, { dateStyle: "medium", timeStyle: "short" }) : null;
    meta.replaceChildren(...L.dataMeta(code(m.data_version || "-"), when));
  } catch (e) {
    if (token !== detailToken) return;
    meta.replaceWith(errorBox(e, () => {
      detailKey = null;
      render();
    }));
  }
}

function renderDetail() {
  const token = ++detailToken;
  const detail = $("#detail");
  const pane = h("div", { class: "pane" });
  detail.replaceChildren(pane);
  detail.scrollTop = 0;
  if (mode === "about") renderAbout(pane, token);
  else if (mode === "item") renderItem(pane, token);
  else renderEmpty(pane);
}

function applyLocale() {
  if (uiLoc === state.loc) return;
  uiLoc = state.loc;
  L = I18N[uiLoc];
  document.documentElement.lang = dataLang(uiLoc);
  $('meta[name="description"]').setAttribute("content", L.description);
  $("#brand-name").textContent = L.site;
  const input = $("#q");
  input.placeholder = L.searchPlaceholder;
  input.setAttribute("aria-label", L.searchLabel);
  $("#seg").setAttribute("aria-label", L.langLabel);
  $("#side").setAttribute("aria-label", L.navLabel);
  $("#list").setAttribute("aria-label", L.listLabel);
  $("#detail").setAttribute("aria-label", L.detailLabel);
  $("#legal").textContent = L.legal;
  navGroups.data.textContent = L.groupData;
  navGroups.quests.textContent = L.groupQuests;
  for (const [view, a] of navLinks) a.firstChild.textContent = viewLabel(view);
}

function updateNav() {
  const loc = state.loc;
  for (const [view, a] of navLinks) {
    a.href = hrefFor(loc, view, null);
    if (view === state.view) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  }
  const side = $("#side");
  const active = navLinks.get(state.view);
  if (active && side.scrollWidth > side.clientWidth) {
    const left = active.offsetLeft - 16;
    if (left < side.scrollLeft || active.offsetLeft + active.offsetWidth > side.scrollLeft + side.clientWidth) side.scrollLeft = left;
  }
  counts(loc).then((c) => {
    if (loc !== state.loc) return;
    for (const [view, a] of navLinks) {
      const n = a.querySelector(".nav-n");
      if (n) n.textContent = c[view] != null ? fmt(c[view]) : "";
    }
  }, () => {});
}

function modeOf() {
  if (state.view !== "about" && state.slug != null) return "item";
  if (state.query || state.view !== "about") return "list";
  return "about";
}

function render() {
  applyLocale();
  $("#app").dataset.mode = mode;
  $("#brand").href = hrefFor(state.loc, "about", null);
  for (const b of $("#seg").children) b.setAttribute("aria-pressed", String(b.dataset.loc === state.loc));
  updateNav();

  const lk = state.query ? `s|${state.loc}|${state.query}` : state.view !== "about" ? `v|${state.loc}|${state.view}` : null;
  if (lk && lk !== listKey) {
    listKey = lk;
    renderList();
  } else {
    markCurrent(false);
  }

  const dk = mode === "item" ? `i|${state.loc}|${state.view}|${state.slug}`
    : mode === "about" ? `a|${state.loc}`
    : `e|${state.loc}|${state.query ? "?" : state.view}`;
  if (dk !== detailKey) {
    detailKey = dk;
    renderDetail();
  }

  if (mode === "about") document.title = L.site;
  else if (mode === "list") document.title = `${state.query ? L.searchDocTitle(state.query) : viewLabel(state.view)} - ${L.site}`;
}

function route() {
  const next = parseHash();
  const canonical = hrefFor(next.loc, next.view, next.slug);
  if (safeDecode(location.hash) !== safeDecode(canonical)) history.replaceState(null, "", canonical);
  const prevMode = mode;
  Object.assign(state, next);
  mode = modeOf();
  let restore = 0;
  if (mode === "item" && prevMode !== "item") savedScroll = scrollY;
  else if (mode !== "item" && prevMode === "item") restore = savedScroll;
  render();
  if (narrow.matches) scrollTo(0, restore);
}

function setQuery(raw) {
  const q = raw.trim();
  const valid = /[^\x00-\x7f]/.test(q) ? q.length >= 1 : q.length >= 2;
  const next = valid ? q : "";
  if (next === state.query) return;
  state.query = next;
  if (next && narrow.matches && state.slug != null) {
    state.slug = null;
    history.replaceState(null, "", hrefFor(state.loc, state.view, null));
  }
  mode = modeOf();
  render();
  if (narrow.matches) scrollTo(0, 0);
}

async function switchLocale(loc) {
  if (loc === state.loc) return;
  let slug = state.slug;
  if (slug != null) {
    try {
      const idx = await getJSON(apiPath(loc, state.view));
      if (!(idx.items || []).some((i) => i.slug === slug)) slug = null;
    } catch {
      slug = null;
    }
  }
  location.hash = hrefFor(loc, state.view, slug);
}

function init() {
  const link = (view) => {
    const a = h("a", { "data-view": view }, h("span", null, ""), view === "about" ? null : h("span", { class: "nav-n" }));
    navLinks.set(view, a);
    return a;
  };
  navGroups.data = h("div", { class: "nav-group" });
  navGroups.quests = h("div", { class: "nav-group" });
  $("#nav").append(
    link("about"),
    navGroups.data,
    ...CAT_KEYS.map((k) => link(k)),
    navGroups.quests,
    ...QTYPE_KEYS.map((q) => link("quests/" + q)));

  for (const b of $("#seg").children) b.addEventListener("click", () => switchLocale(b.dataset.loc));

  const input = $("#q");
  let timer = 0;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => setQuery(input.value), 180);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      input.value = "";
      setQuery("");
    } else if (e.key === "ArrowDown" || e.key === "Enter") {
      clearTimeout(timer);
      setQuery(input.value);
      const first = $("#list .row");
      if (first && mode !== "about") {
        e.preventDefault();
        first.focus();
      }
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName)) return;
    e.preventDefault();
    input.focus();
    input.select();
  });

  $("#list").addEventListener("keydown", (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    const rows = [...e.currentTarget.querySelectorAll(".row")];
    const i = rows.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    const next = rows[i + (e.key === "ArrowDown" ? 1 : -1)];
    if (!next) return;
    next.focus();
    if (!narrow.matches) {
      history.replaceState(null, "", next.getAttribute("href"));
      route();
    }
  });

  getJSON("/v1").then((m) => {
    $("#ver").replaceChildren("data_version ", code(m.data_version || "-"));
  }, () => {});

  window.addEventListener("hashchange", route);
  route();
}

init();
</script>
</body>
</html>
